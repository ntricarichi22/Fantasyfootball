name: Production failover preflight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-failover-preflight
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'ntricarichi22/Fantasyfootball' && github.ref == 'refs/heads/main'
    environment: supabase-production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Read source provider configuration without changing it
        run: node scripts/failover/preflight.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
