name: Supabase Migration CI

on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/validate-supabase-migrations.bash"
      - "scripts/test-supabase-clean-db.bash"
      - "scripts/test-ai-db-concurrency.mjs"
      - "scripts/test-auth-http-smoke.*"
      - "scripts/test-next-auth-boundaries.mjs"
      - "scripts/test-staged-security-rollout.bash"
      - "scripts/test-migration-validator.bash"
      - "scripts/test-commissioner-assignment.bash"
      - "scripts/create-commissioner-auth-fixtures.mjs"
      - "scripts/*018-fixtures.mjs"
      - "scripts/*020-fixtures.mjs"
      - "scripts/lib/mailpit.mjs"
      - "package.json"
      - "package-lock.json"
      - "middleware.ts"
      - "instrumentation.ts"
      - "src/app/api/**"
      - "src/infrastructure/auth/**"
      - "src/infrastructure/ai/**"
      - "src/infrastructure/security/**"
      - "src/shared/director-prose/**"
      - "src/shared/league-data/**"
      - "src/shared/asset-values/**"
      - "src/pro-personnel/engine/**"
      - "tests/security-*"
      - "tests/ai-*"
      - "tests/mailpit-*"
      - "tests/league-*"
      - "tests/roster-*"
      - "tests/trade-*"
      - ".github/workflows/supabase-*.yml"
  push:
    # The stacked PR targets the security review branch, so a synchronize event
    # may not evaluate a workflow newly added outside the default branch. Run
    # credential-free disposable CI directly on its review-branch pushes too.
    branches: [main, codex/implement-55-approved-fantasy-football-fixes]
    paths:
      - "supabase/**"
      - "scripts/validate-supabase-migrations.bash"
      - "scripts/test-supabase-clean-db.bash"
      - "scripts/test-ai-db-concurrency.mjs"
      - "scripts/test-auth-http-smoke.*"
      - "scripts/test-next-auth-boundaries.mjs"
      - "scripts/test-staged-security-rollout.bash"
      - "scripts/test-migration-validator.bash"
      - "scripts/test-commissioner-assignment.bash"
      - "scripts/create-commissioner-auth-fixtures.mjs"
      - "scripts/*018-fixtures.mjs"
      - "scripts/*020-fixtures.mjs"
      - "scripts/lib/mailpit.mjs"
      - "package.json"
      - "package-lock.json"
      - "middleware.ts"
      - "instrumentation.ts"
      - "src/app/api/**"
      - "src/infrastructure/auth/**"
      - "src/infrastructure/ai/**"
      - "src/infrastructure/security/**"
      - "src/shared/director-prose/**"
      - "src/shared/league-data/**"
      - "src/shared/asset-values/**"
      - "src/pro-personnel/engine/**"
      - "tests/security-*"
      - "tests/ai-*"
      - "tests/mailpit-*"
      - "tests/league-*"
      - "tests/roster-*"
      - "tests/trade-*"
      - ".github/workflows/supabase-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migration-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Validate migrations in disposable database
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate migration filenames and ordering
        run: ./scripts/validate-supabase-migrations.bash

      - name: Use the supported Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.0
          cache: npm

      - name: Install locked test dependencies
        run: npm ci --ignore-scripts

      - name: Test migration validator and Mailpit adapter
        run: |
          ./scripts/test-migration-validator.bash
          node --test tests/mailpit-parser.test.mjs

      - name: Validate combined application contracts
        run: |
          npx tsc --noEmit
          npm run test:security
          npm run test:ai
          npm run test:audit
          npm run test:alerts
          npm run test:authorization
          npm run test:handler-boundaries
          npm run test:integration-security
          npm run test:league
          npm run test:roster-values
          npm run test:trade-parity
          npm run build
          npm run test:framework-auth

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.45.5

      - name: Prove schema-011 compatibility and reviewed migration transition
        run: ./scripts/test-staged-security-rollout.bash
        env:
          LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Stop disposable stack
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup
          else
            echo "Supabase CLI was not installed; no disposable stack exists to stop."
          fi
