name: Supabase Migration CI

on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/validate-supabase-migrations.bash"
      - "scripts/test-supabase-clean-db.bash"
      - "scripts/test-ai-db-concurrency.mjs"
      - "scripts/test-auth-http-smoke.*"
      - "package.json"
      - "package-lock.json"
      - "middleware.ts"
      - "instrumentation.ts"
      - "src/app/api/**"
      - "src/infrastructure/auth/**"
      - "src/infrastructure/ai/**"
      - "src/infrastructure/security/**"
      - "src/shared/director-prose/**"
      - "tests/security-*"
      - "tests/ai-*"
      - ".github/workflows/supabase-*.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/validate-supabase-migrations.bash"
      - "scripts/test-supabase-clean-db.bash"
      - "scripts/test-ai-db-concurrency.mjs"
      - "scripts/test-auth-http-smoke.*"
      - "package.json"
      - "package-lock.json"
      - "middleware.ts"
      - "instrumentation.ts"
      - "src/app/api/**"
      - "src/infrastructure/auth/**"
      - "src/infrastructure/ai/**"
      - "src/infrastructure/security/**"
      - "src/shared/director-prose/**"
      - "tests/security-*"
      - "tests/ai-*"
      - ".github/workflows/supabase-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migration-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Validate migrations in disposable database
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate migration filenames and ordering
        run: ./scripts/validate-supabase-migrations.bash

      - name: Use the supported Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.0
          cache: npm

      - name: Install locked test dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.45.5

      - name: Start isolated local Supabase stack and apply migrations
        run: |
          cp supabase/baseline/pre001_clean_database.sql \
            supabase/migrations/000_ci_pre001_clean_database.sql
          supabase start

      - name: Rebuild the disposable database from migration history
        run: ./scripts/test-supabase-clean-db.bash
        env:
          LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Exercise real application and Auth boundaries
        run: ./scripts/test-auth-http-smoke.bash

      - name: Stop disposable stack
        if: always()
        run: supabase stop --no-backup
