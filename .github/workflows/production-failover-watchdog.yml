name: Independent production failback watchdog
run-name: Failover watch ${{ inputs.epoch }} controller ${{ inputs.controller_run_id }}
on:
  workflow_dispatch:
    inputs:
      epoch:
        description: Exact reviewed failover epoch; never a URL or credential
        type: string
        required: true
      controller_run_id:
        description: Independent reviewed controller Actions run
        type: string
        required: true
      expected_sha:
        description: Exact reviewed main commit already stored in the private journal
        type: string
        required: true
permissions:
  contents: read
  actions: write
concurrency:
  group: production-failover-independent-watchdog
  cancel-in-progress: false
jobs:
  watch-and-return:
    name: watch-and-return
    if: >-
      github.repository == 'ntricarichi22/Fantasyfootball' &&
      github.ref == 'refs/heads/main' && github.sha == inputs.expected_sha
    environment: supabase-production
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Watch the separate controller and verify failback before releasing admission
        run: node scripts/failover/watchdog.mjs
        env: &watcher_env
          FAILOVER_EPOCH: ${{ inputs.epoch }}
          FAILOVER_CONTROLLER_RUN_ID: ${{ inputs.controller_run_id }}
          FAILOVER_EXPECTED_SHA: ${{ inputs.expected_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FAILOVER_VERCEL_TOKEN: ${{ secrets.FAILOVER_VERCEL_TOKEN }}
          FAILOVER_JOURNAL_KEY: ${{ secrets.FAILOVER_JOURNAL_KEY }}
          FAILOVER_ADMISSION_SECRET: ${{ secrets.FAILOVER_ADMISSION_SECRET }}
          OPS_DRILL_ATTESTATION_SECRET: ${{ secrets.OPS_DRILL_ATTESTATION_SECRET }}
      - name: Retry verified source return after a soft interruption
        if: failure() || cancelled()
        run: FAILOVER_ROLLBACK_ONLY=true node scripts/failover/watchdog.mjs
        env: *watcher_env
