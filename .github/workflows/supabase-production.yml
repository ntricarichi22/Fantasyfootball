name: Supabase Production Deployment

on:
  workflow_run:
    workflows: ["Supabase Migration CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.repository == 'ntricarichi22/Fantasyfootball'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: supabase-production
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Validate production target configuration
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          test "$PROJECT_REF" = "owkxkpkdffhcordlxqte" || {
            echo "SUPABASE_PROJECT_REF is missing or is not the reviewed production target." >&2
            exit 1
          }
          test -n "$ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN is not configured." >&2; exit 1; }
          test -n "$DB_PASSWORD" || { echo "SUPABASE_DB_PASSWORD is not configured." >&2; exit 1; }

      - name: Validate migration filenames and ordering
        run: ./scripts/validate-supabase-migrations.bash

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.45.5

      - name: Link reviewed production target
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Preflight migration history without changing production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase migration list --linked
          supabase db push --linked --dry-run

      - name: Apply reviewed migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked
