name: Operations monitoring
run-name: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.alert_canary && 'Operations monitoring - ALERT CANARY (expected failure)' || 'Operations monitoring' }}
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      alert_canary:
        description: Intentionally fail a labeled alert-delivery canary after real public checks (main only; no app outage)
        type: boolean
        default: false
      cloud_metadata:
        description: Also check backup and database metadata using the protected production environment
        type: boolean
        default: false
  pull_request:
    paths:
      - 'scripts/monitoring/**'
      - 'scripts/recovery/verify-backup-*'
      - 'scripts/lib/supabase-management.mjs'
      - '.github/workflows/operations-monitoring.yml'
permissions:
  contents: read
concurrency:
  group: operations-monitoring-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node --test scripts/recovery/verify-backup-metadata.test.mjs scripts/monitoring/verify-operations.test.mjs scripts/monitoring/verify-file-backup-run.test.mjs tests/production-release-history.test.mjs
  file-backup-freshness:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Detect missed, stale or failed daily file backups
        run: node scripts/monitoring/verify-file-backup-run.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
  public-availability:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check public login, auth denial and database health without credentials
        env:
          MONITOR_APPLICATION_ORIGIN: ${{ vars.MONITOR_APPLICATION_ORIGIN }}
          MONITOR_ALERT_CANARY: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.alert_canary }}
        run: node scripts/monitoring/verify-operations.mjs --public-only
  verify-production-metadata:
    if: github.event_name == 'workflow_dispatch' && inputs.cloud_metadata && github.ref == 'refs/heads/main'
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Existing approval is preserved. Autonomous metadata checks require a future
    # dedicated read-only credential; no token is exposed to PRs or other branches.
    environment: supabase-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Read backup and aggregate database metadata
        env:
          PROJECT_REF: owkxkpkdffhcordlxqte
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BACKUP_MAX_AGE_HOURS: '30'
          RUNTIME_SOURCE_MAX_AGE_HOURS: '30'
          SECURITY_ERROR_MAX_OCCURRENCES: '10'
        run: node scripts/monitoring/verify-operations.mjs --metadata-only
